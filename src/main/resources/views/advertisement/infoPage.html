<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ad Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
            padding-top: 70px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #343a40;
            padding: 15px;
            z-index: 1000;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            transition: 0.3s;
        }
        .navbar a:hover {
            color: #f8d210;
        }
        .btn-custom {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 10px;
        }
        .ad-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }
        .description {
            font-size: 1.1rem;
            color: #6c757d;
        }
        .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #28a745;
        }
        .stars {
            color: #ffc107;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<div class="navbar">
    <span class="text-white" th:text="'Welcome ' + ${userFullName}"></span>

    <div class="d-flex align-items-center">
        <form class="d-flex me-3" role="search">
            <input class="form-control me-2" type="search" placeholder="Search Ads" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

        <a th:href="@{/advertisement/ads}" class="btn btn-sm btn-outline-light me-2">All Ads</a>
        <a th:href="@{/auth/create-page}" class="btn btn-sm btn-outline-light me-2" th:unless="${isLoggedIn}">Register</a>
        <a th:href="@{/auth/users}" class="btn btn-sm btn-outline-light me-2" th:if="${isAdmin}">Users</a>
        <a th:href="@{/advertisement/my_ads}" class="btn btn-sm btn-outline-light me-2" th:if="${isLoggedIn}">My Ads</a>
        <a th:href="@{/auth/login}" class="btn btn-sm btn-outline-info" th:unless="${isLoggedIn}">Login</a>
        <a href="#" class="btn btn-sm btn-outline-danger me-2" th:if="${isLoggedIn}" data-bs-toggle="modal" data-bs-target="#logoutModal">Logout</a>
    </div>
</div>

<!-- Ad Information -->
<div class="container mt-5">
    <div class="row">
        <!-- Image Section -->
        <div class="col-md-6">
            <img th:src="${adInfo.imageURL}" alt="Ad Image" class="img-fluid ad-image">
        </div>

        <!-- Details Section -->
        <div class="col-md-6">
            <h2 class="mb-3" th:text="${adInfo.name}"></h2>
            <p class="description"><strong>Description:</strong> <span th:text="${adInfo.description}"></span></p>
            <p class="price"><strong>Price:</strong> <span th:text="${adInfo.price} + ' ' + ${adInfo.currency}"></span></p>

            <!-- Star Rating -->
            <p><strong>Stars:</strong>
                <span class="stars" th:each="i : ${#numbers.sequence(1, adInfo.stars)}">
                    <i class="fas fa-star"></i>
                </span>
            </p>

            <p><strong>Active:</strong>
                <span th:text="${adInfo.isActive} ? 'Yes' : 'No'"></span>
            </p>

            <a th:href="@{/advertisement/ads}" class="btn btn-primary btn-custom">
                <i class="fas fa-arrow-left"></i> Back to Ads
            </a>
        </div>
    </div>
</div>

<!-- Logout Confirmation Modal -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to log out?
            </div>
            <div class="modal-footer">
                <form th:action="@{/auth/logout}" th:method="POST">
                    <button type="submit" class="btn btn-danger">Yes</button>
                </form>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
