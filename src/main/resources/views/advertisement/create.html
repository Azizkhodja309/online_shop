<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Advertisement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div style="margin: 100px">
    <form th:action="@{/advertisement/create}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Enter name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Write description</label>
            <input type="text" class="form-control" id="description" name="description" required>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Choose category</label>
            <select class="form-select" id="category" name="category" required>
                <option value="" disabled selected hidden>Select category</option>
                <option value="sport">Sport</option>
                <option value="cars">Cars</option>
                <option value="devices">Devices</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Enter price</label>
            <input type="number" class="form-control" id="price" name="price" required min="0" step="0.01">
        </div>

        <div class="mb-3">
            <label for="currency" class="form-label">Select currency</label>
            <select class="form-select" id="currency" name="currency" required>
                <option value="UZS">UZS</option>
                <option value="USD">USD</option>
                <option value="RUB">RUB</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Upload image</label>
            <input type="file" class="form-control" id="image" name="image">
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/advertisement/ads" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
