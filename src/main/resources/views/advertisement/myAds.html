<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Ads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .table th {
            background-color: #343a40;
            color: white;
            text-align: center;
        }

        .table td {
            vertical-align: middle;
            text-align: center;
        }

        .btn-action {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .btn i {
            margin-right: 5px;
        }

        .status-badge {
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 12px;
        }

        .status-active {
            background-color: #28a745;
            color: white;
        }

        .status-inactive {
            background-color: #dc3545;
            color: white;
        }

        /* Description qisqartirish */
        .description-cell {
            max-width: 200px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <a th:href="@{/advertisement/create-page}" class="btn btn-success">
            <i class="fas fa-plus"></i> Add Advertisement
        </a>
        <a th:href="@{/advertisement/ads}" class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <table class="table table-hover table-bordered">
        <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Currency</th>
            <th>Stars</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ad, iterStat : ${myAds}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${ad.name}"></td>
            <td class="description-cell" th:attr="title=${ad.description}" th:text="${ad.description}"></td>
            <td th:text="${ad.price}"></td>
            <td th:text="${ad.currency}"></td>
            <td th:text="${ad.stars}"></td>
            <td>
                <span th:classappend="${ad.isActive} ? 'status-badge status-active' : 'status-badge status-inactive'"
                      th:text="${ad.isActive} ? 'Active' : 'Inactive'">
                </span>
            </td>
            <td class="btn-action">
                <form th:action="@{/advertisement/change-activity}" th:method="POST">
                    <input type="hidden" name="id" th:value="${ad.id}">
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-exchange-alt"></i> Toggle
                    </button>
                </form>

                <form th:action="@{/advertisement/update-page}" th:method="GET">
                    <input type="hidden" name="id" th:value="${ad.id}">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-edit"></i> Update
                    </button>
                </form>

                <form th:action="@{/advertisement/delete}" th:method="POST"
                      onsubmit="return confirm('Are you sure you want to delete this ad?');">
                    <input type="hidden" name="id" th:value="${ad.id}">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
